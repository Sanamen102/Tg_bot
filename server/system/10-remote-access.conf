# /etc/ssh/sshd_config.d/10-remote-access.conf
#
# Сервер доступен по SSH из интернета (проброс порта на роутере), поэтому
# вход только по ключу. Файл назван 10-…, чтобы читаться раньше
# 50-cloud-init.conf: в sshd действует первое встреченное значение, а там
# стоит PasswordAuthentication yes.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
MaxAuthTries 3
