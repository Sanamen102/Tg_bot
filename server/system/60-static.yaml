# Статический адрес домашнего сервера. На него смотрит проброс портов на
# роутере, сертификаты Let's Encrypt и подписки VPN у всех пользователей,
# поэтому меняться он не должен.
network:
  version: 2
  ethernets:
    any:
      dhcp4: false
      addresses:
        - 192.168.101.7/24
      routes:
        - to: default
          via: 192.168.101.1
      # DNS — AdGuard на этом же сервере, он ходит через DoH. Не 1.1.1.1 и не 8.8.8.8:
      # провайдер подменяет их ответы (youtube.com получал NXDOMAIN). Роутер — запасной.
      nameservers:
        addresses: [192.168.101.7, 192.168.101.1]
