# Jellyfin. Буферизацию отключаем: иначе nginx копит видеопоток у себя и
# перемотка начинает лагать.
server {
    listen 443 ssl;
    http2 on;
    server_name tv.aepozhidaev.ru;

    ssl_certificate     /etc/letsencrypt/live/tv.aepozhidaev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tv.aepozhidaev.ru/privkey.pem;

    client_max_body_size 20M;


    # Отдаёт имя, точную версию и ID сервера кому угодно без пароля.
    # Когда выйдет очередная дыра, по этой выдаче собирают список целей.
    location = /System/Info { return 444; }

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
server {
    listen 80;
    server_name tv.aepozhidaev.ru;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
