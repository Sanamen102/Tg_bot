# Панель управления VPN. Имя намеренно нетиповое: сканеры перебирают
# panel/admin/cp, и на такое имя фоновый шум почти не приходит. Защита при
# этом держится на пароле, а не на скрытности имени.
limit_req_zone $binary_remote_addr zone=pultlogin:10m rate=10r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name pult.aepozhidaev.ru;

    ssl_certificate     /etc/letsencrypt/live/pult.aepozhidaev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pult.aepozhidaev.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Вход — единственная страница, которую можно дёргать без пароля,
    # поэтому частоту ограничиваем именно здесь.
    location /login {
        limit_req zone=pultlogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name pult.aepozhidaev.ru;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
