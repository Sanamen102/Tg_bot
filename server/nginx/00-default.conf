# Всё, что пришло не на известное имя, обрывается без ответа. Порты 80 и 443
# смотрят в интернет, и сканеры стучатся круглосуточно — пусть не получают
# даже подсказки о том, что здесь что-то есть.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    return 444;
}

# Проверка Let's Encrypt должна проходить по имени, до выпуска сертификата,
# поэтому отдаём её из общего каталога для любого хоста.
server {
    listen 80;
    server_name ~^.+$;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / { return 444; }
}
