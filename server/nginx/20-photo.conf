# Immich. Заливка фото и видео идёт большими телами, а живые обновления
# библиотеки — по websocket, поэтому лимит снят и апгрейд соединения разрешён.
server {
    listen 443 ssl;
    http2 on;
    server_name photo.aepozhidaev.ru;

    ssl_certificate     /etc/letsencrypt/live/photo.aepozhidaev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photo.aepozhidaev.ru/privkey.pem;

    client_max_body_size 50G;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;


    location / {
        proxy_pass http://127.0.0.1:2283;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
server {
    listen 80;
    server_name photo.aepozhidaev.ru;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
