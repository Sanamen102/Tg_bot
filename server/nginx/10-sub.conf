# Раздача конфигов VPN. Постоянный адрес: меняться будет VPN-сервер, а
# этот URL у людей в клиентах останется навсегда. Панель управления живёт
# отдельным именем — см. 15-pult.conf, чтобы её адрес не светился в
# ссылках, которые получают люди.
server {
    listen 443 ssl;
    http2 on;
    server_name sub.aepozhidaev.ru;

    ssl_certificate     /etc/letsencrypt/live/sub.aepozhidaev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.aepozhidaev.ru/privkey.pem;

    # Статика зеркала: подписки обязаны отдаваться, даже когда VPS
    # недоступен, поэтому через приложение этот путь не идёт.
    location /sub/ {
        proxy_pass http://127.0.0.1:8090/sub/;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}
server {
    listen 80;
    server_name sub.aepozhidaev.ru;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
