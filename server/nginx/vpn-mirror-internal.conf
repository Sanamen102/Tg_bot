# Только раздача подписок. Панель управления живёт отдельным сервисом на
# 8091 — сюда её не проксируем, чтобы у неё был ровно один адрес в сети.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    autoindex off;

    # Секрет подписки — неугадываемый токен, пароля тут быть не может:
    # Clash-клиенты basic-auth при загрузке подписки не умеют.
    location /sub/ {
        default_type text/plain;
        # Clash-совместимые клиенты читают этот заголовок и сами обновляют
        # подписку раз в сутки. Без него человек с выключенным
        # автообновлением останется со старым адресом VPN после переезда —
        # и будет думать, что у него всё сломалось.
        add_header profile-update-interval 24;
        add_header subscription-userinfo "upload=0; download=0; total=0";
        try_files $uri =404;
    }

    location / { return 404; }
}
