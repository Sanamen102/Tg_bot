- Медиа:
    - Jellyfin:
        icon: jellyfin.svg
        href: http://192.168.101.7:8096
        description: Фильмы и сериалы
        server: my-docker
        container: jellyfin
        widgets:
          - type: jellyfin
            url: http://192.168.101.7:8096
            key: "ЗАМЕНИТЬ_КЛЮЧОМ"
            enableBlocks: true
            enableNowPlaying: false
          - type: customapi
            url: http://192.168.101.7:8096/Items?ParentId=9997817c3349e7577039013dfbcebd16&Recursive=true&IncludeItemTypes=Video
            method: GET
            headers:
              X-Emby-Token: ЗАМЕНИТЬ_КЛЮЧОМ
            mappings:
              - field: TotalRecordCount
                label: домашних роликов
