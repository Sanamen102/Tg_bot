services:
  # SOCKS5-мост наружу через mieru (клиент — mihomo, он же Clash.Meta).
  # У mieru нет TLS-хендшейка и SNI, поэтому ТСПУ нечего фингерпринтить —
  # в отличие от VLESS+Reality, который в 2026 режется по поведению.
  # Настройка: cp mieru/config.yaml.example mieru/config.yaml и вписать свои логин/пароль.
  # Бот ходит на него по внутренней сети: TELEGRAM_PROXY=socks5://mieru:1080
  mieru:
    image: metacubex/mihomo:latest
    container_name: homepilot-mieru
    restart: unless-stopped
    volumes:
      - ./mieru/config.yaml:/root/.config/mihomo/config.yaml:ro
      # Кэш подписки: сюда mihomo складывает последнюю удачную загрузку,
      # чтобы подняться даже когда сервер подписок недоступен. Нужен rw.
      - ./mieru/providers:/root/.config/mihomo/providers
    ports:
      # Для отладки с хоста и для tv-vpn, который ходит сюда как в socks5-аплинк
      # (curl --socks5-hostname 127.0.0.1:1080)
      - "127.0.0.1:1080:1080"

  homepilot:
    build: .
    container_name: homepilot
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Moscow}
    # Чтобы ZAPRET_SSH_HOST=host.docker.internal резолвился в IP хоста
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Управление Docker-контейнерами (обязательно для /containers, /logs, /restart)
      - /var/run/docker.sock:/var/run/docker.sock
      # Корень хоста только для чтения — чтобы видеть реальные диски (/disk, /status)
      - /:/host/root:ro
      # Состояние батареи ноутбука: детектор отключения света + лимит заряда.
      # rw нужен для записи charge_control_end_threshold (BATTERY_CHARGE_LIMIT)
      - /sys/class/power_supply:/sys/class/power_supply:rw
      # SSH-ключ для управления zapret на хосте (только чтение)
      - ./ssh:/app/ssh:ro
      # История метрик для /graph — переживает пересборку образа
      - ./data:/app/data
      # Медиатека: чтобы скачанные по ссылке видео (yt-dlp) попадали в Jellyfin.
      # Путь хоста при необходимости поправьте в docker-compose.override.yml
      - ${MEDIA_PATH:-/home/san/media}:/media
    # Для SMART-мониторинга (/smart, SMART_DEVICES в .env) раскомментируйте
    # и подставьте свой диск (узнать: lsblk -d -o NAME,TYPE,SIZE):
    # devices:
    #   - /dev/nvme0n1:/dev/nvme0n1   # NVMe-диск (или /dev/sda для SATA)
    # cap_add:
    #   - SYS_RAWIO   # доступ к SMART у SATA-дисков
    #   - SYS_ADMIN   # доступ к SMART у NVMe-дисков
